name: build-and-deploy

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST
  workflow_dispatch: {}      # 手動実行も可

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore AI judgment cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ai-judged-${{ github.run_id }}
          restore-keys: |
            ai-judged-

      - name: Fetch new items (skip already archived)
        env:
          IWATE_ROOT: ${{ github.workspace }}
          MAX_AGE_DAYS: "30"
        run: python -u scripts/10_fetch.py

      - name: AI judge (Claude Sonnet 5)
        env:
          IWATE_ROOT: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/20_judge.py

      - name: AI dedup
        env:
          IWATE_ROOT: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/30_dedup.py

      - name: Build HTML
        env:
          IWATE_ROOT: ${{ github.workspace }}
        run: |
          python -u scripts/40_build_html.py
          test -f site/index.html

      - name: Commit archive + keepalive marker
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 毎日必ず更新するファイルでcron自動停止(60日無活動)を防ぐ
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last_run.txt
          git add data/archive.jsonl data/dropped.jsonl data/last_run.txt
          if git diff --cached --quiet; then
            echo "No changes (unexpected)"
          else
            git commit -m "chore(archive): daily update [skip ci]"
            git push
          fi

      - name: Save AI judgment cache
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ai-judged-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
